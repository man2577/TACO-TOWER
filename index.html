<!DOCTYPE html>
<html lang="es">
<head>
  <meta name="monetag" content="087986edd7b07874415dedf5b3984b2c">
<title>Taco Stacker</title>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=DM+Sans:wght@500;700&display=swap">
<style>
:root{--bg:#0f3a3c;--bg2:#17595a;--ink:#fff6df;--gold:#ffb627;--chile:#d62839;--dark:#082426;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0f3a3c;--bg2:#17595a;--ink:#fff6df}}
:root[data-theme="dark"]{--bg:#0f3a3c}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:'DM Sans',system-ui,sans-serif;overflow:hidden;touch-action:manipulation;-webkit-user-select:none;user-select:none}
.disp{font-family:'Bowlby One','Arial Black',Impact,sans-serif}
.btn{display:block;width:100%;border-radius:16px;padding:14px 16px;font-weight:700;font-size:17px;border:0;color:var(--dark);background:var(--gold);box-shadow:0 5px 0 #b5780a;transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #b5780a}
.btn.alt{background:var(--ink);box-shadow:0 5px 0 #b9ab86}
.btn.alt:active{box-shadow:0 1px 0 #b9ab86}
.btn:disabled{opacity:.45;pointer-events:none}
.ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;background:rgba(8,36,38,.82);z-index:20}
.hide{display:none!important}
@keyframes pop{0%{transform:scale(.4);opacity:0}40%{transform:scale(1.15);opacity:1}100%{transform:scale(1);opacity:1}}
.pop{animation:pop .45s ease-out}
@media (prefers-reduced-motion: reduce){.pop{animation:none}}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
</style>
</head>
  <body>
<div id="app" class="relative mx-auto h-full w-full max-w-[480px] overflow-hidden" style="background:linear-gradient(var(--bg),var(--bg2))">
  <canvas id="c" class="absolute inset-0 h-full w-full"></canvas>

  <div id="hud" class="pointer-events-none absolute inset-x-0 top-[54px] z-10 flex items-start justify-between px-4 hide">
    <div>
      <div id="h" class="disp text-5xl leading-none">0 cm</div>
      <div id="rec" class="mt-1 text-sm font-bold opacity-80">Récord 0 cm</div>
    </div>
    <button id="mute" class="pointer-events-auto rounded-full px-3 py-2 text-lg" style="background:rgba(8,36,38,.55)" aria-label="Sonido">🔊</button>
  </div>

  <div id="menu" class="ov">
    <div class="text-6xl">🌮</div>
    <h1 class="disp mt-3 text-center text-5xl leading-none">Taco<br>Stacker</h1>
    <p class="mt-4 max-w-[270px] text-center text-base opacity-90">Toca la pantalla para soltar cada ingrediente justo encima del anterior. Lo que sobresale se corta.</p>
    <div class="mt-4 flex gap-2 text-2xl" aria-hidden="true"><span>🫓</span><span>🥩</span><span>🍍</span><span>🌶️</span></div>
    <button id="play" class="btn mt-7 max-w-[300px]">Jugar</button>
    <div id="menuBest" class="mt-4 text-sm font-bold opacity-80"></div>
  </div>

  <div id="count" class="ov hide" style="background:rgba(8,36,38,.45);pointer-events:none"><div id="cn" class="disp text-[140px] leading-none pop">3</div></div>

  <div id="over" class="ov hide">
    <h2 class="disp text-center text-4xl leading-tight">¡Se cayó el taco!</h2>
    <div class="mt-5 text-sm font-bold opacity-80">Altura alcanzada</div>
    <div id="oh" class="disp text-6xl leading-none" style="color:var(--gold)">0 cm</div>
    <div id="ob" class="mt-2 text-sm font-bold opacity-80"></div>
    <div class="mt-6 flex w-full max-w-[320px] flex-col gap-3">
      <button id="ad1" class="btn">📺 Ver anuncio (5 s) y duplicar altura</button>
      <button id="ad2" class="btn">🎬 Anuncio de video (3 s) y duplicar altura</button>
      <button id="again" class="btn alt">Jugar otra vez</button>
    </div>
    <p class="mt-3 text-xs opacity-60">Los anuncios son simulados.</p>
  </div>

  <div id="ad" class="ov hide" style="background:#082426;z-index:30">
    <div class="w-full max-w-[320px] rounded-3xl p-6 text-center" style="background:var(--chile);color:#fff6df">
      <div class="text-xs font-bold opacity-80">Anuncio simulado</div>
      <div class="mt-2 text-6xl">🌶️</div>
      <div class="disp mt-2 text-3xl leading-tight">Salsa Don Chile</div>
      <p class="mt-2 text-base">Ponle fuego a tu taco.</p>
    </div>
    <div class="mt-6 h-3 w-full max-w-[320px] overflow-hidden rounded-full" style="background:rgba(255,246,223,.2)"><div id="bar" class="h-full w-0" style="background:var(--gold)"></div></div>
    <div id="adt" class="mt-3 text-sm font-bold">Recompensa en 5 s</div>
    <button id="claim" class="btn mt-5 max-w-[320px]" disabled>Reclamar ×2</button>
  </div>
</div>

<script>
(function(){
const $=id=>document.getElementById(id);
const cv=$('c'),ctx=cv.getContext('2d');
let W=360,H=640,dpr=1;
function resize(){dpr=Math.min(window.devicePixelRatio||1,2);W=cv.clientWidth;H=cv.clientHeight;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}
window.addEventListener('resize',resize);resize();

/* ---------- Audio ---------- */
let ac=null,muted=false;
function A(){if(!ac){try{ac=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(ac&&ac.state==='suspended')ac.resume();return ac}
function tone(f,d,type,v,to,delay){const a=A();if(!a||muted)return;const t=a.currentTime+(delay||0),o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(to)o.frequency.exponentialRampToValueAtTime(to,t+d);g.gain.setValueAtTime(v||.2,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.03)}
function noise(d,v,fq){const a=A();if(!a||muted)return;const n=Math.floor(a.sampleRate*d),b=a.createBuffer(1,n,a.sampleRate),x=b.getChannelData(0);for(let i=0;i<n;i++)x[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();f.type='lowpass';f.frequency.value=fq||800;g.gain.value=v||.3;s.buffer=b;s.connect(f);f.connect(g);g.connect(a.destination);s.start()}
const SFX={
 tick:()=>tone(440,.15,'square',.12),
 go:()=>{tone(660,.12,'square',.14);tone(990,.25,'square',.14,0,.1)},
 drop:()=>tone(520,.18,'triangle',.18,160),
 land:()=>{tone(130,.14,'sine',.35,60);noise(.08,.2,600)},
 perfect:()=>[660,880,1320].forEach((f,i)=>tone(f,.18,'sine',.2,0,i*.07)),
 cut:()=>tone(240,.2,'sawtooth',.12,90),
 collapse:()=>{noise(.9,.5,500);tone(160,.7,'sawtooth',.18,40)},
 over:()=>[392,330,262,196].forEach((f,i)=>tone(f,.25,'triangle',.2,0,i*.16)),
 coin:()=>{tone(988,.08,'square',.14);tone(1319,.3,'square',.14,0,.08)}
};
$('mute').onclick=e=>{e.stopPropagation();muted=!muted;$('mute').textContent=muted?'🔇':'🔊'};

/* ---------- Estado ---------- */
const BH=38,CM=1.5;
let state='menu',stack=[],cur=null,drp=null,debris=[],pops=[],cam=0,camT=0,combo=0,bw=200,baseY=0,shake=0,last=0,time=0,score=0,best=0,doubled=false;
try{best=parseFloat(localStorage.getItem('tacoBest'))||0}catch(e){}
const fmt=n=>(Math.round(n*10)/10).toString().replace(/\.0$/,'')+' cm';
const hover=()=>Math.max(H*.2,84);
const cmNow=()=>stack.length*CM;
function updHud(){$('h').textContent=fmt(cmNow());$('rec').textContent='Récord '+fmt(best)}
$('menuBest').textContent=best?'Récord: '+fmt(best):'';

function spawn(){const t=stack.length%4,w=stack[stack.length-1].w;return{x:0,w,t,dir:1}}
function startRun(){
  baseY=H-90;bw=Math.min(W*.62,260);stack=[{x:(W-bw)/2,w:bw,t:0}];cur=null;drp=null;debris=[];pops=[];cam=0;camT=0;combo=0;shake=0;doubled=false;
  updHud();
}
function countdown(){
  A();startRun();state='count';
  ['menu','over','ad'].forEach(i=>$(i).classList.add('hide'));
  $('hud').classList.remove('hide');$('count').classList.remove('hide');
  let n=3;
  const step=()=>{
    const el=$('cn');el.textContent=n>0?n:'¡Ya!';el.classList.remove('pop');void el.offsetWidth;el.classList.add('pop');
    if(n>0){SFX.tick();n--;setTimeout(step,800)}
    else{SFX.go();setTimeout(()=>{$('count').classList.add('hide');state='play';cur=spawn()},500)}
  };
  step();
}

/* ---------- Mecánica ---------- */
function dropIt(){
  if(state!=='play'||!cur||drp)return;
  drp={x:cur.x,w:cur.w,t:cur.t,wy:hover()-cam,vy:2};cur=null;SFX.drop();
}
function addDebris(x,wy,w,t,i,vx,vy){debris.push({x,wy,w,t,i,vx,vy,rot:0,vr:(Math.random()-.5)*.14})}
const top=i=>baseY-(i+1)*BH;
function land(){
  const n=stack.length,prev=stack[n-1],d=drp,ty=top(n);
  const l=Math.max(d.x,prev.x),r=Math.min(d.x+d.w,prev.x+prev.w),ov=r-l;
  if(ov<4){fail(d,ty);return}
  const diff=Math.abs(d.x-prev.x);let nx,nw;
  if(diff<6){
    combo++;nx=prev.x;nw=prev.w;
    if(combo>=3&&nw<bw){const g=Math.min(10,bw-nw);nw+=g;nx-=g/2;nx=Math.max(0,Math.min(W-nw,nx))}
    pops.push({s:combo>=3?'¡Perfecto ×'+combo+'!':'¡Perfecto!',x:W/2,y:ty+cam,life:60});SFX.perfect();
  }else{
    combo=0;nx=l;nw=ov;
    if(d.x<prev.x)addDebris(d.x,ty,l-d.x,d.t,n,-1.2,0);else addDebris(r,ty,d.x+d.w-r,d.t,n,1.2,0);
    SFX.cut();SFX.land();
  }
  if(diff<6)SFX.land();
  stack.push({x:nx,w:nw,t:d.t});drp=null;
  camT=Math.max(0,(stack.length)*BH-H*.42);
  updHud();cur=spawn();
}
function fail(d,ty){
  addDebris(d.x,ty,d.w,d.t,stack.length,(Math.random()-.5)*3,0);
  stack.forEach((s,i)=>addDebris(s.x,top(i),s.w,s.t,i,(Math.random()-.5)*7,-Math.random()*5));
  score=cmNow();stack=[];drp=null;cur=null;state='collapse';shake=24;SFX.collapse();
  setTimeout(gameOver,1200);
}
function gameOver(){
  state='over';SFX.over();
  if(score>best){best=score;try{localStorage.setItem('tacoBest',String(best))}catch(e){}}
  $('oh').textContent=fmt(score);$('ob').textContent='Récord: '+fmt(best);
  ['ad1','ad2'].forEach(i=>{$(i).disabled=false});
  $('hud').classList.add('hide');$('over').classList.remove('hide');
}

/* ---------- Anuncios simulados ---------- */
let adTimer=null;
function showAd(sec){
  $('over').classList.add('hide');$('ad').classList.remove('hide');
  const claim=$('claim');claim.disabled=true;$('bar').style.width='0%';
  const t0=performance.now();clearInterval(adTimer);
  adTimer=setInterval(()=>{
    const p=Math.min(1,(performance.now()-t0)/(sec*1000));$('bar').style.width=(p*100)+'%';
    const left=Math.ceil(sec*(1-p));$('adt').textContent=p<1?'Recompensa en '+left+' s':'¡Listo!';
    if(p>=1){clearInterval(adTimer);claim.disabled=false}
  },80);
}
$('claim').onclick=()=>{
  if(doubled)return;doubled=true;score*=2;SFX.coin();
  if(score>best){best=score;try{localStorage.setItem('tacoBest',String(best))}catch(e){}}
  $('ad').classList.add('hide');$('over').classList.remove('hide');
  $('oh').textContent=fmt(score)+' ✨';$('ob').textContent='¡Altura duplicada! Récord: '+fmt(best);
  ['ad1','ad2'].forEach(i=>{$(i).disabled=true});
};
$('ad1').onclick=()=>{A();showAd(5)};
$('ad2').onclick=()=>{A();showAd(3)};
$('play').onclick=countdown;
$('again').onclick=countdown;
cv.addEventListener('pointerdown',e=>{e.preventDefault();A();dropIt()});
window.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();dropIt()}});

/* ---------- Dibujo ---------- */
const COL=[['#f0cf82','#c99a4b'],['#8c4a2c','#55291a'],['#ffd23f','#e8a100'],['#e03145','#8f1627']];
function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect?ctx.roundRect(x,y,w,h,r):ctx.rect(x,y,w,h)}
function block(x,y,w,t,i){
  const h=BH-3,c=COL[t];ctx.save();
  rr(x,y,w,h,h*.42);ctx.fillStyle=c[0];ctx.fill();ctx.clip();
  ctx.fillStyle=c[1];ctx.globalAlpha=.9;
  for(let k=0;k<Math.floor(w/20);k++){
    const px=x+9+k*20+((i*13+k*7)%8),py=y+8+((i*5+k*11)%14);
    if(t===0){ctx.beginPath();ctx.arc(px,py,3,0,6.3);ctx.fill()}
    else if(t===1){rr(px-4,py-3,8,6,3);ctx.fill()}
    else if(t===2){ctx.fillRect(px-1,y,3,h)}
    else{ctx.fillStyle=k%2?'#7ac943':'#fff6df';ctx.beginPath();ctx.arc(px,py,2.6,0,6.3);ctx.fill()}
  }
  ctx.globalAlpha=1;ctx.fillStyle='rgba(255,255,255,.22)';ctx.fillRect(x,y,w,5);
  ctx.restore();
  rr(x,y,w,h,h*.42);ctx.lineWidth=2;ctx.strokeStyle=c[1];ctx.stroke();
}
const FL=['#ffb627','#d62839','#7ac943','#f2e9d0','#ff7aa8'];
function banner(){
  ctx.strokeStyle='rgba(255,246,223,.5)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,10);ctx.lineTo(W,10);ctx.stroke();
  const n=Math.ceil(W/38);
  for(let k=0;k<n;k++){
    const x=k*(W/n),w=W/n,sw=Math.sin(time*.03+k)*2.5;
    ctx.fillStyle=FL[k%5];ctx.beginPath();ctx.moveTo(x+2,10);ctx.lineTo(x+w-2,10);ctx.lineTo(x+w-2,34);ctx.lineTo(x+w/2+sw,40);ctx.lineTo(x+2,34);ctx.closePath();ctx.fill();
    ctx.fillStyle='rgba(15,58,60,.55)';ctx.beginPath();ctx.arc(x+w/2+sw/2,22,4,0,6.3);ctx.fill();
  }
}
function draw(){
  ctx.clearRect(0,0,W,H);ctx.save();
  if(shake>0){ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake)}
  // comal
  const py=baseY+cam;
  if(py<H+40){rr(W*.08,py,W*.84,16,8);ctx.fillStyle='#082426';ctx.fill();rr(W*.08,py+16,W*.84,H,0);ctx.fillStyle='#061b1d';ctx.fill()}
  stack.forEach((s,i)=>block(s.x,top(i)+cam,s.w,s.t,i));
  if(cur){block(cur.x,hover(),cur.w,cur.t,stack.length);}
  if(drp)block(drp.x,drp.wy+cam,drp.w,drp.t,stack.length);
  debris.forEach(d=>{ctx.save();ctx.translate(d.x+d.w/2,d.wy+cam+BH/2);ctx.rotate(d.rot);block(-d.w/2,-BH/2,d.w,d.t,d.i);ctx.restore()});
  ctx.restore();
  banner();
  pops.forEach(p=>{ctx.globalAlpha=Math.min(1,p.life/25);ctx.font="26px 'Bowlby One','Arial Black',sans-serif";ctx.textAlign='center';ctx.lineWidth=5;ctx.strokeStyle='#082426';ctx.strokeText(p.s,p.x,p.y);ctx.fillStyle='#ffb627';ctx.fillText(p.s,p.x,p.y);ctx.globalAlpha=1});
}
function loop(t){
  const dt=Math.min(2.5,(t-(last||t))/16.67);last=t;time+=dt;
  if(state==='play'&&cur){
    const sp=(2.6+Math.min(stack.length*.14,4.8))*dt;
    cur.x+=cur.dir*sp;
    if(cur.x<=0){cur.x=0;cur.dir=1}
    if(cur.x+cur.w>=W){cur.x=W-cur.w;cur.dir=-1}
  }
  if(drp){drp.vy+=.9*dt;drp.wy+=drp.vy*dt;if(drp.wy>=top(stack.length))land()}
  cam+=(camT-cam)*.09*dt;
  debris.forEach(d=>{d.vy+=.7*dt;d.wy+=d.vy*dt;d.x+=d.vx*dt;d.rot+=d.vr*dt});
  debris=debris.filter(d=>d.wy+cam<H+200);
  pops.forEach(p=>{p.y-=.7*dt;p.life-=dt});pops=pops.filter(p=>p.life>0);
  if(shake>0)shake=Math.max(0,shake-1.2*dt);
  draw();requestAnimationFrame(loop);
}
startRun();requestAnimationFrame(loop);
})();
</script>
</body>
</html>
